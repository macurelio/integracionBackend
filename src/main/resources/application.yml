spring:
  application:
    name: user-api
  datasource:
    url: jdbc:h2:mem:userdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Configurable regex and JWT secret
app:
  validation:
    # Default password regex: minimum 8 characters, at least one letter and one number
    password-regex: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$"
  security:
    jwt-secret: "myVerySecretKeyForJwtTokenGenerationMyVerySecretKeyForJwtTokenGeneration"
    jwt-expiration-ms: 86400000 # 24 hours

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
