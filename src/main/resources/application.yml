spring:
  application:
    name: user-api
  datasource:
    url: jdbc:h2:mem:userdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

 # Expresión regular configurable y secreto JWT
app:
  validation:
    # Expresión regular por defecto para contraseña: mínimo 8 caracteres, al menos una letra y un número
    password-regex: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$"
  security:
    jwt-secret: "myVerySecretKeyForJwtTokenGenerationMyVerySecretKeyForJwtTokenGeneration"
    jwt-expiration-ms: 86400000 # 24 horas

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
